name: Scrape leady - przetargi

on:
  schedule:
    # co 4 godziny
    - cron: '0 */4 * * *'
  workflow_dispatch: {} # pozwala odpalić ręcznie z zakładki Actions

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Wywołaj endpoint scrapera na Vercelu
        run: |
          RESPONSE=$(curl -sS -X GET "${{ secrets.SCRAPE_ENDPOINT_URL }}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --fail)
          echo "Odpowiedź endpointu:"
          echo "$RESPONSE" | python3 -m json.tool || echo "$RESPONSE"
