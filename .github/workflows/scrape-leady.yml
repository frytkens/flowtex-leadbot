name: Scrape leady - przetargi

on:
  schedule:
    # co 30 minut
    - cron: '*/30 * * * *'
  workflow_dispatch: {} # pozwala odpalić ręcznie z zakładki Actions

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Wywołaj endpoint scrapera na Vercelu
        run: |
          curl -sS -X GET "${{ secrets.SCRAPE_ENDPOINT_URL }}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --fail
