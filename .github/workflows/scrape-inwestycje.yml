name: Scrape leady - inwestycje (GUNB)

on:
  schedule:
    # GUNB aktualizuje pliki raz w nocy — odpalanie częściej nie ma sensu.
    # 4:30 UTC = 6:30 czasu letniego (CEST, UTC+2) / 5:30 czasu zimowego (CET, UTC+1).
    - cron: '30 4 * * *'
  workflow_dispatch:
    inputs:
      debug_headers:
        description: 'Tryb debug: pokaż wykryte kolumny i przykładowe wiersze, nic nie zapisuj'
        type: boolean
        default: false

permissions:
  contents: write # potrzebne, żeby zacommitować zaktualizowany plik stanu

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Ustaw Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Zainstaluj zależności
        run: npm install

      - name: Uruchom skrypt modułu 2
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_TABLE_NAME: ${{ secrets.SUPABASE_TABLE_NAME }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GUNB_DEBUG_HEADERS: ${{ github.event.inputs.debug_headers || 'false' }}
        run: node scripts/scrape-inwestycje.js

      - name: Zacommituj zaktualizowany plik stanu (jeśli się zmienił)
        run: |
          if [ -n "$(git status --porcelain data/gunb-seen-ids.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/gunb-seen-ids.json
            git commit -m "chore: aktualizacja stanu GUNB [skip ci]"
            git push
          else
            echo "Brak zmian w pliku stanu — pomijam commit."
          fi
